name: Codex Observability Plugin

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.merge_group.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubicloud-standard-8
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 24]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check formatting and types
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build bundle
        run: npm run build

      - name: Verify committed bundle
        run: git diff --exit-code -- plugins/openobserve/dist plugins/openobserve/hooks/hooks.json

      - name: Verify package contents
        run: npm pack --dry-run
